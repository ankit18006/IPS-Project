<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Image Rotator</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      background: #121212;
      color: white;
      margin: 0;
      padding: 0;
      transition: 0.4s;
    }

    header {
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    .controls {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    input[type="range"] {
      width: 60%;
      margin-top: 20px;
      accent-color: #4caf50;
    }

    #image-container {
      margin-top: 30px;
    }

    canvas {
      border-radius: 16px;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
    }

    .light {
      background: #f7f7f7;
      color: #222;
    }

    .light button {
      background: rgba(0, 0, 0, 0.05);
      color: black;
    }

    .light button:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .angle-display {
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>🖼 Smart Image Rotator</header>

  <div class="controls">
    <input type="file" id="fileInput" accept="image/*" />
    <button onclick="rotate90()">🔄 Rotate 90°</button>
    <button onclick="zoomIn()">🔍 Zoom In</button>
    <button onclick="zoomOut()">🔎 Zoom Out</button>
    <button onclick="saveImage()">💾 Save</button>
    <button onclick="toggleTheme()">🌙 Light/Dark</button>
  </div>

  <div id="image-container">
    <canvas id="canvas"></canvas>
  </div>

  <div>
    <p class="angle-display" id="angleLabel">Angle: 0°</p>
    <input type="range" id="angleSlider" min="0" max="360" value="0" />
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const angleSlider = document.getElementById("angleSlider");
    const angleLabel = document.getElementById("angleLabel");

    let img = new Image();
    let currentAngle = 0;
    let zoomLevel = 1;
    let darkMode = true;

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (event) {
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    img.onload = function () {
      drawImage();
    };

    function drawImage() {
      const width = img.width * zoomLevel;
      const height = img.height * zoomLevel;
      canvas.width = width + 100;
      canvas.height = height + 100;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((currentAngle * Math.PI) / 180);
      ctx.drawImage(img, -width / 2, -height / 2, width, height);
      ctx.restore();
    }

    function rotate90() {
      currentAngle = (currentAngle + 90) % 360;
      angleSlider.value = currentAngle;
      angleLabel.textContent = `Angle: ${currentAngle}°`;
      drawImage();
    }

    angleSlider.addEventListener("input", (e) => {
      currentAngle = parseFloat(e.target.value);
      angleLabel.textContent = `Angle: ${currentAngle}°`;
      drawImage();
    });

    function zoomIn() {
      if (zoomLevel < 3) {
        zoomLevel += 0.1;
        drawImage();
      }
    }

    function zoomOut() {
      if (zoomLevel > 0.3) {
        zoomLevel -= 0.1;
        drawImage();
      }
    }

    function saveImage() {
      const link = document.createElement("a");
      link.download = "rotated_image.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function toggleTheme() {
      darkMode = !darkMode;
      document.body.classList.toggle("light");
    }
  </script>
</body>
</html>
